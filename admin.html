<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración local | Sol del Llao</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="pages.css"><link rel="stylesheet" href="admin.css"></head><body><header class="sub-header"><a href="index.html"><img src="assets/logo-sol-del-llao.png" alt="Sol del Llao"></a><a href="index.html">Ver sitio →</a></header><main class="admin"><section class="admin-intro"><p class="eyebrow eyebrow-dark">Administración local</p><h1>Modificá el contenido de tu vista previa.</h1><p>Los cambios se guardan sólo en este navegador y computadora. Todavía no se publican en Internet ni reemplazan los archivos originales.</p></section><form id="admin-form" class="admin-form"><section><h2>Portada</h2><label>Título<input id="hero-title-input" maxlength="80" placeholder="Tu refugio entre el bosque"></label><label>Descripción<textarea id="hero-copy-input" maxlength="220" placeholder="Una cabaña cálida..."></textarea></label><label>Reemplazar foto de portada<input id="hero-image-input" type="file" accept="image/*"></label></section><section><h2>Galería</h2><p class="form-help">Marcá las imágenes que querés ocultar de la página principal.</p><div id="gallery-toggles" class="gallery-toggles"></div><label>Agregar una foto a la galería<input id="extra-image-input" type="file" accept="image/*"></label><label>Texto debajo de la foto<input id="extra-caption-input" maxlength="40" placeholder="Por ejemplo: Vista del jardín"></label></section><div class="admin-actions"><button type="submit">Guardar cambios en la vista previa</button><button id="reset-settings" type="button" class="secondary">Restaurar diseño original</button></div><p id="save-message" class="save-message" role="status"></p></form></main><script src="admin.js"></script></body></html>
